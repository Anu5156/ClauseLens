services:
  - type: web
    name: clauselens
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m backend.seed
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
